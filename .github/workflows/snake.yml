name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate purple contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Jatinn07
          outputs: |
            dist/github-snake.svg?color_snake=%236D28D9&color_dots=%23F2EAFB,%23E1D3F5,%23C4A1FF,%239A6CE0,%236D28D9
            dist/github-snake-dark.svg?color_snake=%23E9D5FF&color_dots=%230D0A12,%23281A38,%234B2B6A,%237D4DB5,%23C4A1FF

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
